name: CQuotient
description: 'CQuotient is the artificial intelligence and shopper-data technology that powers personalization
  and predictive commerce for Salesforce B2C Commerce (Commerce Cloud) Einstein. Originally an independent
  commerce-personalization startup, CQuotient was acquired by Demandware in 2013, and Demandware was in
  turn acquired by Salesforce in 2016. Today the CQuotient engine underpins Einstein product recommendations,
  predictive sort, Einstein search dictionaries, and shopper activity capture. Its developer surface is
  the Salesforce B2C Commerce Einstein API (also referred to as the CQuotient API), documented within the
  Salesforce Developers documentation rather than on a standalone CQuotient portal.'
